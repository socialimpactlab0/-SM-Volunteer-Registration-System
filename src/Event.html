<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>義工活動</title>
  <style>
    :root{--green:#23894a;--green2:#35a85d;--light:#eef8f0;--line:#dce8df;--text:#182019;--muted:#6b746d;--red:#c93830;--orange:#df6a18}
    *{box-sizing:border-box} body{margin:0;background:#f5f7f5;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Arial,sans-serif}
    .wrap{max-width:720px;margin:0 auto;min-height:100vh;background:#fff}
    header{padding:26px 20px 20px;text-align:center;background:linear-gradient(180deg,#edf9ef,#fff);border-bottom:1px solid var(--line)}
    header h1{margin:0;color:#0c6530;font-size:32px} header p{margin:7px 0 0;color:var(--muted);font-size:16px}
    main{padding:16px}
    .notice{padding:13px 14px;border-radius:12px;background:#f2f5f2;color:#5e675f;text-align:center;margin-bottom:14px}.error{background:#fff0ef;color:#b3261e}.success{background:#e8f7ec;color:#126a35}.wait{background:#fff4e5;color:#8e5000}
    .activity{border:1px solid var(--line);border-radius:16px;margin-bottom:14px;overflow:hidden;background:#fff;box-shadow:0 2px 9px rgba(0,0,0,.04)}
    .activity-head{padding:15px 16px;background:var(--light);display:flex;justify-content:space-between;gap:12px;align-items:center}
    .activity-title{font-size:22px;font-weight:800;color:#0d5f2f}.status{font-size:14px;font-weight:800;white-space:nowrap}
    .activity-body{padding:14px 16px}.meta{display:grid;grid-template-columns:68px 1fr;gap:8px;padding:4px 0;font-size:16px}.meta .k{color:var(--muted)}
    .count{display:flex;justify-content:space-between;gap:10px;margin-top:10px;font-size:16px}.short{color:var(--orange);font-weight:800}.full{color:var(--red);font-weight:800}
    .btn{width:100%;border:0;border-radius:11px;padding:13px 14px;font-size:18px;font-weight:800;cursor:pointer}.primary{background:var(--green2);color:#fff}.secondary{background:#fff;color:#176d39;border:2px solid var(--green2)}.danger{background:#fff1f0;color:var(--red);border:2px solid #e7807a}.btn:disabled{opacity:.55}
    .detail-top{display:flex;align-items:center;gap:10px;margin-bottom:14px}.back{width:auto;padding:9px 13px;font-size:16px}
    .card{border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:14px}.card-title{background:var(--light);padding:13px 16px;font-size:20px;font-weight:800;color:#0d5f2f}.card-body{padding:15px 16px}
    .detail-title{font-size:25px;font-weight:800;color:#0d5f2f;margin-bottom:12px}.row{display:grid;grid-template-columns:86px 1fr;gap:8px;padding:6px 0;font-size:17px}.label{color:var(--muted)}.value{font-weight:650}
    .person{padding:9px 0;border-bottom:1px solid #edf1ee;font-size:17px}.person:last-child{border-bottom:none}.empty{color:var(--muted);padding:7px 0}
    .field{margin-bottom:12px}.field label{display:block;margin-bottom:5px;font-weight:700}.field input{width:100%;padding:12px 13px;border:1px solid #ccd8cf;border-radius:10px;font-size:17px}
    .small-link{display:block;text-align:center;color:#176d39;text-decoration:underline;margin-top:13px;cursor:pointer}.hide{display:none!important}
    .mybox{text-align:center;padding:4px}.mybox .big{font-size:23px;font-weight:800;color:#176d39;margin-bottom:5px}.mybox .sub{color:var(--muted);font-size:16px}
    .footer{text-align:center;color:#747c76;font-size:13px;padding:12px 0 26px}
    @media(max-width:430px){header h1{font-size:29px}.activity-title{font-size:20px}.detail-title{font-size:23px}.row{grid-template-columns:78px 1fr;font-size:16px}}
  </style>
</head>
<body>
<div class="wrap">
  <header><h1>義工活動</h1><p>選擇活動即可查看名單、報名或取消</p></header>
  <main>
    <div id="loading" class="notice">載入活動中…</div>
    <div id="error" class="notice error hide"></div>

    <section id="listView" class="hide">
      <div id="activityList"></div>
      <div id="noActivities" class="notice hide">目前沒有開放中的活動。</div>
    </section>

    <section id="detailView" class="hide">
      <div class="detail-top">
        <button class="btn secondary back" onclick="showList()">← 返回活動列表</button>
      </div>

      <div class="card">
        <div class="card-body">
          <div id="detailTitle" class="detail-title"></div>
          <div class="row"><div class="label">集合</div><div class="value" id="meet"></div></div>
          <div class="row"><div class="label">活動</div><div class="value" id="time"></div></div>
          <div class="row"><div class="label">地點</div><div class="value" id="place"></div></div>
          <div class="row" id="addressRow"><div class="label">地址</div><div class="value" id="address"></div></div>
          <div class="row" id="contactRow"><div class="label">接洽人</div><div class="value" id="contact"></div></div>
          <div class="row"><div class="label">需求</div><div class="value"><span id="need"></span> 人</div></div>
          <div class="row"><div class="label">目前</div><div class="value"><span id="count"></span> / <span id="need2"></span> 人</div></div>
          <div class="row"><div class="label">狀態</div><div class="value" id="status"></div></div>
          <div class="row" id="descRow"><div class="label">說明</div><div class="value" id="desc"></div></div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">目前名單（<span id="rosterCount">0</span> 人）</div>
        <div class="card-body" id="roster"></div>
      </div>

      <div class="card hide" id="waitCard">
        <div class="card-title">候補名單（<span id="waitCount">0</span> 人）</div>
        <div class="card-body" id="waitlist"></div>
      </div>

      <div class="card" id="signupCard">
        <div class="card-title">我要報名</div>
        <div class="card-body">
          <div class="field"><label>姓名</label><input id="name" autocomplete="name" placeholder="請輸入姓名"></div>
          <div class="field"><label>手機號碼</label><input id="phone" inputmode="tel" autocomplete="tel" placeholder="例如：0912345678"></div>
          <button id="signupBtn" class="btn primary" onclick="signup()">我要報名</button>
          <div id="signupMsg" class="notice hide"></div>
          <span class="small-link" onclick="showLookup()">我已報名，要查詢／取消</span>
        </div>
      </div>

      <div class="card hide" id="lookupCard">
        <div class="card-title">查詢我的報名</div>
        <div class="card-body">
          <div class="field"><label>手機號碼</label><input id="lookupPhone" inputmode="tel" placeholder="輸入報名時的手機號碼"></div>
          <button class="btn secondary" onclick="lookupMine()">查詢</button>
          <span class="small-link" onclick="hideLookup()">返回</span>
        </div>
      </div>

      <div class="card hide" id="myCard">
        <div class="card-title">你的狀態</div>
        <div class="card-body mybox">
          <div class="big" id="myStatus"></div>
          <div class="sub" id="myName"></div>
          <button class="btn danger" style="margin-top:14px" onclick="cancelMine()">取消報名</button>
        </div>
      </div>
    </section>

    <div class="footer">報名或取消後，人數會立即更新</div>
  </main>
</div>

<script>
  const DIRECT_EVENT_ID = <?!= JSON.stringify(eventId) ?>;
  let currentEventId = '';
  let currentPhone = '';
  let currentEvent = null;

  document.addEventListener('DOMContentLoaded', () => {
    google.script.run
      .withSuccessHandler(events => {
        document.getElementById('loading').classList.add('hide');
        renderActivityList(events || []);
        if (DIRECT_EVENT_ID) openEvent(DIRECT_EVENT_ID);
        else showList();
      })
      .withFailureHandler(showError)
      .getPublicEvents();
  });

  function renderActivityList(events) {
    const box = document.getElementById('activityList');
    box.innerHTML = '';
    document.getElementById('noActivities').classList.toggle('hide', events.length > 0);

    events.forEach(e => {
      const card = document.createElement('div');
      card.className = 'activity';
      const statusText = e.isFull ? (e.waitCount ? `已額滿｜候補 ${e.waitCount} 人` : '已額滿，可候補') : `尚缺 ${e.shortage} 人`;
      const statusClass = e.isFull ? 'full' : 'short';
      card.innerHTML = `
        <div class="activity-head">
          <div class="activity-title">${esc(e.dateText)}（${esc(e.weekday)}） ${esc(e.name)}</div>
          <div class="status ${statusClass}">${esc(statusText)}</div>
        </div>
        <div class="activity-body">
          <div class="meta"><div class="k">集合</div><div>${esc(e.meetTime || '—')}</div></div>
          <div class="meta"><div class="k">地點</div><div>${esc(e.place || '—')}</div></div>
          <div class="count"><span>已報 ${e.positiveCount} / ${e.need} 人</span><span class="${statusClass}">${esc(statusText)}</span></div>
          <button class="btn primary" style="margin-top:12px">報名／查看</button>
        </div>`;
      card.querySelector('button').onclick = () => openEvent(e.eventId);
      box.appendChild(card);
    });
  }

  function showList() {
    currentEventId = '';
    currentPhone = '';
    currentEvent = null;
    document.getElementById('detailView').classList.add('hide');
    document.getElementById('listView').classList.remove('hide');
    window.scrollTo({top:0,behavior:'smooth'});
  }

  function openEvent(eventId) {
    currentEventId = eventId;
    currentPhone = localStorage.getItem('volunteer_phone_' + eventId) || '';
    document.getElementById('listView').classList.add('hide');
    document.getElementById('detailView').classList.add('hide');
    document.getElementById('loading').classList.remove('hide');
    google.script.run
      .withSuccessHandler(data => {
        document.getElementById('loading').classList.add('hide');
        if (!data || !data.ok) {
          showError((data && data.message) || '找不到活動。');
          showList();
          return;
        }
        renderDetail(data);
      })
      .withFailureHandler(showError)
      .getEventPageData(eventId, currentPhone);
  }

  function renderDetail(data) {
    currentEvent = data.event;
    const e = data.event;
    document.getElementById('detailView').classList.remove('hide');
    document.getElementById('detailTitle').textContent = `${e.dateText}（${e.weekday}） ${e.name}`;
    document.getElementById('meet').textContent = e.meetTime || '—';
    document.getElementById('time').textContent = [e.startTime,e.endTime].filter(Boolean).join('–') || '—';
    document.getElementById('place').textContent = e.place || '—';
    setOptional('addressRow','address',e.address);
    setOptional('contactRow','contact',e.contact);
    setOptional('descRow','desc',e.description);
    document.getElementById('need').textContent = e.need;
    document.getElementById('need2').textContent = e.need;
    document.getElementById('count').textContent = e.positiveCount;

    const st = document.getElementById('status');
    if (e.isFull) { st.textContent = e.waitCount ? `已額滿｜候補 ${e.waitCount} 人` : '已額滿，可候補'; st.className='value full'; }
    else { st.textContent = `尚缺 ${e.shortage} 人`; st.className='value short'; }

    renderNames('roster',data.roster);
    document.getElementById('rosterCount').textContent=data.roster.length;

    if(data.waitlist.length){
      document.getElementById('waitCard').classList.remove('hide');
      document.getElementById('waitCount').textContent=data.waitlist.length;
      renderNames('waitlist',data.waitlist);
    }else{
      document.getElementById('waitCard').classList.add('hide');
    }

    if(data.my) showMine(data.my);
    else showSignup(e);

    window.scrollTo({top:0,behavior:'smooth'});
  }

  function showSignup(e){
    document.getElementById('myCard').classList.add('hide');
    document.getElementById('lookupCard').classList.add('hide');
    document.getElementById('signupCard').classList.remove('hide');
    const btn=document.getElementById('signupBtn');
    btn.disabled=!e.canRegister;
    btn.textContent=e.isFull?'我要候補':'我要報名';
  }

  function showMine(my){
    currentPhone=my.phone;
    localStorage.setItem('volunteer_phone_'+currentEventId,currentPhone);
    document.getElementById('signupCard').classList.add('hide');
    document.getElementById('lookupCard').classList.add('hide');
    document.getElementById('myCard').classList.remove('hide');
    document.getElementById('myStatus').textContent=my.status==='候補'?'候補中':'已報名';
    document.getElementById('myName').textContent='姓名：'+my.name;
  }

  function signup(){
    const name=document.getElementById('name').value.trim();
    const phone=document.getElementById('phone').value.trim();
    if(!name) return showMsg('請輸入姓名。','error');
    if(!phone) return showMsg('請輸入手機號碼。','error');
    const btn=document.getElementById('signupBtn');
    btn.disabled=true;btn.textContent='處理中…';

    google.script.run
      .withSuccessHandler(r=>{
        currentPhone=phone.replace(/\D/g,'');
        localStorage.setItem('volunteer_phone_'+currentEventId,currentPhone);
        showMsg(r.message,r.status==='候補'?'wait':'success');
        setTimeout(()=>openEvent(currentEventId),350);
      })
      .withFailureHandler(err=>{
        btn.disabled=false;
        btn.textContent=currentEvent&&currentEvent.isFull?'我要候補':'我要報名';
        showMsg(err.message||err,'error');
      })
      .registerVolunteer({eventId:currentEventId,name,phone});
  }

  function showLookup(){
    document.getElementById('signupCard').classList.add('hide');
    document.getElementById('lookupCard').classList.remove('hide');
  }
  function hideLookup(){
    document.getElementById('lookupCard').classList.add('hide');
    document.getElementById('signupCard').classList.remove('hide');
  }
  function lookupMine(){
    const p=document.getElementById('lookupPhone').value.trim();
    if(!p) return alert('請輸入手機號碼。');
    currentPhone=p.replace(/\D/g,'');
    openEvent(currentEventId);
  }
  function cancelMine(){
    if(!confirm('確定要取消這場活動的報名嗎？')) return;
    google.script.run
      .withSuccessHandler(r=>{
        alert(r.message);
        localStorage.removeItem('volunteer_phone_'+currentEventId);
        currentPhone='';
        openEvent(currentEventId);
      })
      .withFailureHandler(err=>alert(err.message||err))
      .cancelRegistration(currentEventId,currentPhone);
  }

  function renderNames(id,list){
    const el=document.getElementById(id);el.innerHTML='';
    if(!list.length){el.innerHTML='<div class="empty">目前還沒有人報名</div>';return;}
    list.forEach(x=>{const d=document.createElement('div');d.className='person';d.textContent=x.no+'. '+x.name;el.appendChild(d);});
  }
  function setOptional(rowId,valueId,value){
    document.getElementById(rowId).classList.toggle('hide',!value);
    if(value) document.getElementById(valueId).textContent=value;
  }
  function showMsg(text,type){
    const el=document.getElementById('signupMsg');
    el.textContent=text;
    el.className='notice '+(type||'');
  }
  function showError(err){
    document.getElementById('loading').classList.add('hide');
    const el=document.getElementById('error');
    el.textContent=(err&&err.message)||err||'發生錯誤';
    el.classList.remove('hide');
  }
  function esc(v){
    return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  }
</script>
</body>
</html>
